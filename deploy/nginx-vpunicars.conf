# nginx: sirve la página y el panel (dist/) y pasa /api y /uploads al backend Node (puerto 3001).
# Todo en el mismo dominio: sin CORS y con las mismas cabeceras de seguridad que vercel.json.
# Certbot agrega el bloque HTTPS (puerto 443) automáticamente.

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name vpunicars.cl www.vpunicars.cl;

    root /var/www/vpunicars/dist;
    index index.html;
    client_max_body_size 7m; # fotos de hasta 6 MB


    include /etc/nginx/snippets/vpunicars-seguridad.conf;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Archivos con hash del build: caché larga
    location /assets/ { include /etc/nginx/snippets/vpunicars-seguridad.conf; expires 1y; add_header Cache-Control "public, immutable" always; try_files $uri =404; }
    location /fotos/  { expires 30d; try_files $uri =404; }
    # Cuadros de las animaciones al deslizar (14 MB): sin caché se volvían a bajar en cada visita
    location /seq/    { expires 30d; try_files $uri =404; }
    location /fonts/  { expires 1y; try_files $uri =404; }
    location ~* ^/[^/]+\.(webp|png|jpg|svg|ico|webmanifest)$ { expires 30d; try_files $uri =404; }

    # Páginas: /admin y /verificar sin la extensión .html (igual que en Vercel)
    location = /admin     { include /etc/nginx/snippets/vpunicars-seguridad.conf; add_header X-Robots-Tag "noindex, nofollow" always; add_header Cache-Control "no-store" always; try_files /admin.html =404; }
    location = /verificar { include /etc/nginx/snippets/vpunicars-seguridad.conf; add_header X-Robots-Tag "noindex, nofollow" always; add_header Cache-Control "no-store" always; try_files /verificar.html =404; }
    location / { try_files $uri $uri.html $uri/ =404; }

    # Canal en tiempo real: sin buffer y conexión larga
    location = /api/tiempo-real {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        expires 30d;
    }
}
